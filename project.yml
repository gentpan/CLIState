name: CLIState
options:
  bundleIdPrefix: com.clistate
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "0086"
    DEAD_CODE_STRIPPING: YES
packages:
  CLIStateKit:
    path: Packages/CLIStateKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  CLIState:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
        excludes:
          - "Preview/Screenshots/**"
    # No -AppleLanguages scheme argument: it would override Settings › General › Language.
    # The String Catalog already shows Chinese when the system prefers it; pass
    # `-AppleLanguages (zh-Hans)` by hand to check Chinese on an English system.
    scheme:
      testTargets:
        - CLIStateAppTests
    dependencies:
      - package: CLIStateKit
        product: CLIStateDomain
      - package: CLIStateKit
        product: CLIStateApplication
      - package: CLIStateKit
        product: CLIStateAI
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clistate.app
        PRODUCT_NAME: CLIState
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: CLIState  # must match CLIState.app; InfoPlist.xcstrings localizes it to "CLI State"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 GiantAccel, LLC."
        ENABLE_APP_SANDBOX: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CLIStateAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppTests
      # Compile the scheduling boundary without an app host, so tests never scan
      # or change the developer's real CLI environment.
      - path: App/Model/BackgroundScheduler.swift
      - path: App/Model/BackgroundCheckResult.swift
      - path: App/Model/TerminalCommandText.swift
      - path: App/Model/OverviewInsights.swift
      - path: App/Features/Discover/RecommendedTool.swift
    dependencies:
      - package: CLIStateKit
        product: CLIStateDomain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.clistate.app-tests
